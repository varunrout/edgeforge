[project]
name = "edgeforge"
version = "0.1.0"
description = "Football sportsbook pricing engine: the lifecycle of a football price."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "duckdb",
    "statsmodels",
    "scikit-learn",
    "pydantic>=2",
    "pyyaml",
    "pyarrow",
    "requests",
    "typer",
]

[project.scripts]
edgeforge = "edgeforge.cli:app"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-requests", "types-PyYAML", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeforge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# long SQL and check descriptions
"src/edgeforge/data/validate.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
